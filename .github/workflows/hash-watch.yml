name: hash-watch

# UBI-182: this repo's own real drift check, rewritten for the
# group-container format (v2.0.0). Kubernetes' own real published
# identity is a GROUP of two members (kubernetes: resource mode;
# kubernetes_ds: data-source mode), both fetched from the identical live
# release-1.37 OpenAPI/Swagger description but built through genuinely
# different pipelines -- ubx-provider-dynamic's own --generate-snapshot-group
# regenerates BOTH real members in one real invocation and assembles
# them into one real, versioned group container (internal/snapshot's own
# AssembleGroup: the highest real change level across every member,
# never hand-picked). --prev-snapshot points at THIS checkout's own root
# (already the real manifest.json + members/ shape a real group needs),
# so a content change that doesn't affect either member's own translated
# schema produces NoChange and no PR, the identical real discipline the
# single-member version of this workflow already had.
#
# Never auto-merges, matching every other repo in this org.

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday, 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out ubx-schema-kubernetes
        uses: actions/checkout@v4

      - name: Check out ubx-provider-dynamic's own latest real published release (to build it from source)
        id: dynver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # UBI-194: this must be a real, tagged release, never main HEAD --
          # a snapshot's own min_binary_version is stamped from this same
          # build (see the "Build ubx-provider-dynamic" step's -ldflags
          # below), so building an untagged HEAD would stamp every
          # regenerated snapshot with the meaningless default "dev" instead
          # of a real, acquirable version. Using the latest real GitHub
          # Release (not main HEAD) means MinBinaryVersion always names a
          # binary a real ubx install can actually acquire via
          # provider.AcquireDynamicProviderBinary.
          ver="$(gh api repos/Ubiquex/ubx-provider-dynamic/releases/latest --jq '.tag_name' | sed 's/^v//')"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "Building against ubx-provider-dynamic's real, latest published release: v$ver"
          git clone --depth=1 --branch "v$ver" \
            "https://github.com/Ubiquex/ubx-provider-dynamic.git" \
            "${{ runner.temp }}/ubx-provider-dynamic-src"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ runner.temp }}/ubx-provider-dynamic-src/go.mod

      - name: Build ubx-provider-dynamic
        run: |
          set -euo pipefail
          go build -C "${{ runner.temp }}/ubx-provider-dynamic-src" \
            -ldflags "-X github.com/ubiquex/ubx-provider-dynamic/internal/snapshot.BinaryVersion=${{ steps.dynver.outputs.version }}" \
            -o "${{ runner.temp }}/ubx-provider-dynamic" \
            ./cmd/ubx-provider-dynamic
          got="$("${{ runner.temp }}/ubx-provider-dynamic" --version)"
          if [ "$got" != "${{ steps.dynver.outputs.version }}" ]; then
            echo "built binary reports version '$got', expected '${{ steps.dynver.outputs.version }}'" >&2
            exit 1
          fi

      - name: Read the committed group version before regenerating
        id: before
        run: |
          set -euo pipefail
          current="$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "Committed manifest.json is at version $current"

      - name: Regenerate the real member and assemble the group
        id: gen
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/gen/.ubx"
          cat > "${{ runner.temp }}/gen/.ubx/config" <<'EOF'
          [dynamic_providers.kubernetes]
          schema_source = "openapi"
          schema_url = "https://raw.githubusercontent.com/kubernetes/kubernetes/release-1.37/api/openapi-spec/swagger.json"
          base_url = "https://kubernetes.example.invalid"
          EOF

          # UBI-182's own real collapse: one entry's own single fetch now
          # produces both real members (kubernetes resource mode,
          # kubernetes_ds data-source mode) -- the old, separate
          # [dynamic_providers.kubernetes_ds] table is gone, matching the
          # SAME collapse ubiquex's own sdk/providers/.ubx/config already
          # went through for every provider's own resource/data-source
          # pair (config.Provider.DataSources' own doc comment,
          # ubx-provider-dynamic).
          rm -rf "${{ runner.temp }}/new-group"
          ( cd "${{ runner.temp }}/gen" && \
            "${{ runner.temp }}/ubx-provider-dynamic" \
              --generate-snapshot-group="${{ runner.temp }}/new-group" \
              --group-repo-name=kubernetes \
              --group-members=kubernetes \
              --prev-snapshot="$GITHUB_WORKSPACE" )

          new="$(python3 -c "import json; print(json.load(open('${{ runner.temp }}/new-group/manifest.json'))['version'])")"
          echo "new=$new" >> "$GITHUB_OUTPUT"
          if [ "$new" = "${{ steps.before.outputs.current }}" ]; then
            echo "newer=false" >> "$GITHUB_OUTPUT"
            echo "Already current at ${{ steps.before.outputs.current }} -- nothing to do."
          else
            echo "newer=true" >> "$GITHUB_OUTPUT"
            echo "Real version change: ${{ steps.before.outputs.current }} -> $new"
          fi

      - name: Report which real members changed
        if: steps.gen.outputs.newer == 'true'
        run: |
          set -euo pipefail
          for f in "${{ runner.temp }}"/new-group/members/*.json; do
            name="$(basename "$f" .json)"
            if ! diff -q "$f" "members/$name.json" > /dev/null 2>&1; then
              echo "changed member: $name"
            fi
          done

      - name: Open PR
        if: steps.gen.outputs.newer == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cp "${{ runner.temp }}/new-group/manifest.json" manifest.json
          cp "${{ runner.temp }}"/new-group/members/*.json members/
          git config user.name "ubx-bot"
          git config user.email "actions@users.noreply.github.com"
          branch="snapshot-regen/kubernetes-${{ steps.gen.outputs.new }}"
          git checkout -b "$branch"
          git add manifest.json members/
          git commit -m "snapshot: regenerate from Kubernetes OpenAPI spec, ${{ steps.before.outputs.current }} -> ${{ steps.gen.outputs.new }}"
          git push origin "$branch" --force
          gh pr create \
            --title "snapshot: regenerate from Kubernetes OpenAPI spec (${{ steps.before.outputs.current }} -> ${{ steps.gen.outputs.new }})" \
            --body "Automated regeneration (\`.github/workflows/hash-watch.yml\`), triggered by re-running ubx-provider-dynamic's own \`--generate-snapshot-group\` against Kubernetes' live \`release-1.37\` branch OpenAPI/Swagger description (both real members: \`kubernetes\` resource mode, \`kubernetes_ds\` data-source mode) and diffing mechanically against the previously committed group.

          Previous version: \`${{ steps.before.outputs.current }}\`
          New version: \`${{ steps.gen.outputs.new }}\`

          Only the real, changed members/*.json files are touched -- unaffected members stay byte-identical. Never auto-merges -- review the diff before merging. After merge, dispatch \`publish.yml\` to cut the real GitHub Release." \
            --base main --head "$branch"
