name: ci

# manifest.json + members/ is a real, hand-maintained group container
# (UBI-182), not code -- there is no meaningful "go build" here. The
# real, meaningful check is the same one this repo's own publish.yml
# already runs at release time (--dump-group-summary), just run on
# every push and pull request instead of only when someone manually
# publishes: it loads the real, committed snapshot through
# ubx-provider-dynamic's own real parsing path (the same one
# provider.AcquireSchema uses in production), and fails loudly if
# manifest.json references a member with no backing file, a member
# file is not valid JSON, or the group otherwise fails to load.
# Confirmed live against both failure modes before wiring this in
# anywhere: a manifest entry with no backing file, and an
# invalid-JSON manifest, both fail with a real, specific error and a
# non-zero exit, not a check that always passes.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-snapshot:
    runs-on: ubuntu-latest
    steps:
      # The base branch is main, enforced rather than asked.
      #
      # TRAPS.md's own "a stacked PR is only safe while its base is
      # unmerged" trap. A PR based on another branch merges into THAT
      # branch. GitHub retargets it when the base lands on main, but
      # only if it gets there first, and twice in ubiquex it did not:
      # the dependent PR merged into an already-dead base seconds
      # later, showed MERGED, and its content never reached main.
      #
      # stale-base-check (where this org has it) asks the narrower
      # question, whether the base is ALREADY merged, and it is a real
      # guard. It cannot catch this shape though: it triggers on
      # pull_request opened/synchronize/reopened, so it evaluates when
      # the PR is pushed and never at the moment the merge button is
      # clicked, which is the one moment the trap fires. A PR opened
      # while its base was healthy stays green through the base
      # merging out from under it.
      #
      # This question does not depend on when it is asked. The base is
      # main or it is not, and that cannot change between opening and
      # merging except by retargeting, which only moves it toward main.
      #
      # It lives inside a job branch protection already requires, so a
      # stacked PR cannot merge rather than merely being discouraged,
      # and no branch-protection change was needed to add it.
      - name: The base branch is main
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$BASE" = "main" ]; then
            echo "base is main"
            exit 0
          fi
          {
            echo "This PR targets \"$BASE\", not main."
            echo
            echo "A PR based on another branch merges into THAT branch. If the base"
            echo "reaches main first, this PR merges into a dead branch, reports MERGED,"
            echo "and its content never lands. Nothing tells that apart from a real merge"
            echo "except an explicit ancestry check after the fact."
            echo
            echo "Branch from main and open this against main. If it genuinely depends on"
            echo "unmerged work, wait for that to land and rebase onto main:"
            echo
            echo "    git rebase --onto main <old-base> <this-branch>"
            echo
            echo "If a non-main base is ever genuinely right in this repo, change this step"
            echo "deliberately, in its own reviewed PR, rather than working around it."
          } >&2
          exit 1

      - name: Check out
        uses: actions/checkout@v4

      - name: Check out ubx-provider-dynamic (to build it from source)
        run: |
          set -euo pipefail
          git clone --depth=1 \
            "https://github.com/Ubiquex/ubx-provider-dynamic.git" \
            "${{ runner.temp }}/ubx-provider-dynamic-src"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ runner.temp }}/ubx-provider-dynamic-src/go.mod

      - name: Build ubx-provider-dynamic
        run: |
          set -euo pipefail
          go build -C "${{ runner.temp }}/ubx-provider-dynamic-src" \
            -o "${{ runner.temp }}/ubx-provider-dynamic" \
            ./cmd/ubx-provider-dynamic

      - name: Validate the committed group snapshot loads cleanly
        run: |
          set -euo pipefail
          "${{ runner.temp }}/ubx-provider-dynamic" --dump-group-summary="$PWD"

      - name: Snapshot pins a current ubx-provider-dynamic
        # A snapshot decides which binary every `ubx sdk gen` runs, so a
        # stale stamp silently pins pre-fix behaviour forever. UBI-241:
        # six snapshot PRs were cut hours before a behaviour-changing
        # release and nothing rechecked them. Warns on main, fails on a
        # PR, since a snapshot being proposed now should be cut against
        # what is current.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check_snapshot_stamp.py
